[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-hierplace"
version = "0.2.0"
description = "Constraint-driven hierarchical PCB placement with projected gradients"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "PyYAML>=6,<7", "osqp>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "shapely>=2,<3"]

[project.scripts]
pcb-hierplace = "pcb_hierplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
